name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests
      - name: Build exe
        run: pyinstaller --noconfirm --clean MoreThanTinyTask.spec
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/MoreThanTinyTask.exe -Algorithm SHA256).Hash
          "$h  MoreThanTinyTask.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MoreThanTinyTask-windows
          path: |
            dist/MoreThanTinyTask.exe
            dist/SHA256SUMS.txt

      # Pushing a tag like v1.2.0 publishes a GitHub Release with the exe attached
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: More Than Tiny Task ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Download
            **[MoreThanTinyTask.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/MoreThanTinyTask.exe)** — Windows 10/11, no install needed. Just run it.

            > Windows may show *"Windows protected your PC"* because the app isn't code-signed. Click **More info → Run anyway**.
          files: |
            dist/MoreThanTinyTask.exe
            dist/SHA256SUMS.txt

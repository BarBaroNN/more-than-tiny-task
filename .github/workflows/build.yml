name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests
      - name: Build exe
        run: pyinstaller --noconfirm --clean MoreThanTinyTask.spec
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/MoreThanTinyTask.exe -Algorithm SHA256).Hash
          "$h  MoreThanTinyTask.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MoreThanTinyTask-windows
          path: |
            dist/MoreThanTinyTask.exe
            dist/SHA256SUMS.txt

      # A push to main whose version (mttk/__init__.py) has no release yet
      # publishes one, tagged v<version>, with the exe attached.
      - name: Check whether this version needs a release
        id: ver
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import mttk; print(mttk.__version__)")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.ver.outputs.release == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: More Than Tiny Task ${{ steps.ver.outputs.tag || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## Download
            **MoreThanTinyTask.exe** (below, under *Assets*) — Windows 10/11, no install needed. Just run it.

            > Windows may show *"Windows protected your PC"* because the app isn't code-signed. Click **More info → Run anyway**.
          files: |
            dist/MoreThanTinyTask.exe
            dist/SHA256SUMS.txt
